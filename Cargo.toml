[package]
name = "gabriel-laevis-0"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "train"
required-features = ["train"]

[features]
default = ["cpu", "train"]
cpu = ["burn/ndarray"]
metal = ["burn/metal", "burn/autotune", "burn/fusion"]
wgpu = ["burn/wgpu", "burn/autotune", "burn/fusion"]
cuda = ["burn/cuda", "burn/autotune", "burn/fusion"]
bf16 = []
checkpoint = []
# Training stack: data ingestion, tokenizer training, and the Learner (`burn/train` pulls
# autodiff + dataset). A serve-only build omits it and its heavy deps (reqwest/aws-lc,
# tokenizers/onig, parquet, hf-hub, …): `cargo build --bin serve --no-default-features --features metal`.
train = [
    "burn/train",
    "dep:tokenizers",
    "dep:parquet",
    "dep:hf-hub",
    "dep:reqwest",
    "dep:flate2",
    "dep:moka",
    "dep:rayon",
]

[dependencies]
async-stream = "0.3"
axum = "0.8"
burn = { version = "0.21.0" }
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.23"
eyre = "0.6"
fastokens = "0.2"
fastrand = "2"
flate2 = { version = "1", optional = true }
hf-hub = { version = "0.5", optional = true }
kanal = { version = "0.1", features = ["async"] }
moka = { version = "0.12", features = ["sync"], optional = true }
parquet = { version = "58", default-features = false, features = ["snap", "zstd"], optional = true }
rayon = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[profile.dev.package."*"]
opt-level = 3

[profile.maxperf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.maxperf.package."*"]
opt-level = 3
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
