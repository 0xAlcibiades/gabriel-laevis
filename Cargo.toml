[package]
name = "gabriel-laevis-0"
version = "0.1.0"
edition = "2024"

[features]
default = ["cpu"]
cpu = ["burn/ndarray", "burn/train"]
metal = ["burn/metal", "burn/autotune", "burn/fusion", "burn/train"]
wgpu = ["burn/wgpu", "burn/autotune", "burn/fusion", "burn/train"]
cuda = ["burn/cuda", "burn/autotune", "burn/fusion", "burn/train"]
bf16 = []
checkpoint = []

[dependencies]
async-stream = "0.3"
axum = "0.8"
burn = { version = "0.21.0" }
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.23"
eyre = "0.6"
fastokens = "0.2"
fastrand = "2"
hf-hub = "0.5"
kanal = { version = "0.1", features = ["async"] }
moka = { version = "0.12", features = ["sync"] }
parquet = { version = "58", default-features = false, features = ["snap", "zstd"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.dev.package."*"]
opt-level = 3

[profile.maxperf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.maxperf.package."*"]
opt-level = 3
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
